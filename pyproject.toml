[project]
name = "socialdock"
version = "0.1.0"
description = "SocialDock — gestionnaire local de réseaux sociaux (FastAPI + SQLite + React), sans cloud obligatoire."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["migrations/versions", ".venv", "frontend"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplification.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # longueur de ligne : gérée par le formateur et la relecture humaine
    "B008",  # fastapi.Depends() dans les valeurs par défaut est le patron FastAPI standard
    "SIM108", # ternaires : parfois moins lisibles que if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
